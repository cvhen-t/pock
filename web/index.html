<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1a1814" />
    <title>荒原叠卡</title>
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        touch-action: none;
        overscroll-behavior: none;
        background: #1a1814;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      body {
        position: relative;
      }
      #game-container {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #game-container canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        touch-action: none;
      }
      #guide-panel-scroll {
        display: none;
        position: absolute;
        z-index: 30;
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior: contain;
        touch-action: pan-y;
        box-sizing: border-box;
        padding: 10px 14px 12px;
        background: rgba(26, 24, 20, 0.98);
        border: 1px solid rgba(58, 56, 48, 0.75);
        color: #c9c0b0;
        font-size: 11px;
        line-height: 1.6;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        scrollbar-width: thin;
        scrollbar-color: #6a7a5a #2a2820;
        pointer-events: auto;
      }
      #guide-panel-scroll::-webkit-scrollbar {
        width: 8px;
      }
      #guide-panel-scroll::-webkit-scrollbar-track {
        background: #2a2820;
      }
      #guide-panel-scroll::-webkit-scrollbar-thumb {
        background: #6a7a5a;
        border-radius: 4px;
      }
      #guide-panel-scroll h3 {
        margin: 14px 0 6px;
        font-size: 14px;
        font-weight: 700;
        color: #b8c8a0;
        line-height: 1.35;
      }
      #guide-panel-scroll h3:first-child {
        margin-top: 0;
      }
      #guide-panel-scroll p {
        margin: 0 0 6px;
        color: #c9c0b0;
      }
      #guide-panel-scroll ul {
        margin: 0 0 8px;
        padding-left: 1.1em;
      }
      #guide-panel-scroll li {
        margin: 0 0 4px;
      }
      #guide-panel-scroll ul.guide-items li {
        list-style: none;
        margin-left: -0.2em;
        color: #9a9488;
      }
      #guide-panel-scroll ul.guide-items li::before {
        content: '— ';
        color: #7a7468;
      }
      #guide-panel-scroll ul.guide-recipes li {
        color: #c8b888;
        list-style: none;
        margin-left: -0.2em;
      }
      #guide-panel-scroll .guide-time {
        color: #8a8070;
        font-size: 10px;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
